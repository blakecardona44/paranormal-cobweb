name: daily-cron
on:
  schedule:
    - cron: "0 1 * * *"
jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call our API route
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            'https://dashboard.elizabethjudithmartinez.com/api/automate-investment'
