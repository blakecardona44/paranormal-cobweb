name: weekly-cron
on:
  schedule:
    # Runs every Monday at 1 AM UTC
    - cron: "0 1 * * 1"

jobs:
  weekly-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call our weekly API route
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            --request POST \
            'https://dashboard.elizabethjudithmartinez.com/api/update-coin-prices'
